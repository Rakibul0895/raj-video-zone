<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAJ VIDEO ZONE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090d18;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      text-align: center;
      background: #121a2c;
      font-size: 23px;
      font-weight: bold;
      color: #48d9ff;
    }
    main {
      max-width: 600px;
      margin: 35px auto;
      padding: 18px;
    }
    .video-card {
      background: #151e30;
      border-radius: 15px;
      overflow: hidden;
      padding-bottom: 20px;
    }
    .thumb {
      height: 210px;
      background: #253650;
      display: grid;
      place-items: center;
      font-size: 55px;
    }
    h2, p { padding: 0 18px; }
    button {
      display: block;
      margin: 20px auto 0;
      padding: 14px 35px;
      border: 0;
      border-radius: 9px;
      background: #10bce8;
      color: #07111b;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>RAJ VIDEO ZONE</header>
  <main>
    <div class="video-card">
      <div class="thumb">▶</div>
      <h2>Welcome to Raj Video Zone</h2>
      <p>Watch your favourite videos here.</p>
      <button onclick="alert('Video system coming soon!')">
        WATCH NOW
      </button>
    </div>
  </main>
</body>
</html>
